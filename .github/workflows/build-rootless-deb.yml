name: Build rootless DEB

run-name: ${{ github.event_name }} ${{ github.sha }}

on:
  push:
    branches:
      - rootless
  workflow_dispatch:

concurrency:
  group: build-rootless-deb-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build FLEXing rootless package
    runs-on: macos-latest
    env:
      THEOS_PACKAGE_SCHEME: rootless
      ARCHS: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: 'theos/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'
          libgcuniversal: true
          libgcuniversal-src: 'MrGcGamer/LibGcUniversalDocumentation'
          libgcuniversal-branch: 'master'
          altlist: true
          altlist-src: 'opa334/AltList'
          altlist-branch: 'main'

      - name: Patch source compatibility
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Tweak.xm')
          text = path.read_text()
          text = text.replace('Class cls = (__bridge Class)classLookup[className];', 'Class cls = (Class)classLookup[className];')
          text = text.replace(
              'typedef void (^FLEXingGlobalsRowAction)(__kindof UITableViewController *host);\n',
              'typedef void (^FLEXingGlobalsRowAction)(__kindof UITableViewController *host);\nstatic FLEXingGlobalsRowAction flexingPanelEntryAction = nil;\n'
          )
          text = text.replace(
              '    FLEXingGlobalsRowAction action = ^(__kindof UITableViewController *host) {\n        FLEXingOpenPanelMenu(host);\n    };\n\n    ((void (*)(id, SEL, NSString *, FLEXingGlobalsRowAction))[manager methodForSelector:registerSelector])(manager, registerSelector, @"FLEXing", action);',
              '    if (!flexingPanelEntryAction) {\n        flexingPanelEntryAction = [^(__kindof UITableViewController *host) {\n            FLEXingOpenPanelMenu(host);\n        } copy];\n    }\n\n    ((void (*)(id, SEL, NSString *, FLEXingGlobalsRowAction))[manager methodForSelector:registerSelector])(manager, registerSelector, @"FLEXing", flexingPanelEntryAction);'
          )
          path.write_text(text)
          PY

      - name: Build rootless package
        shell: bash
        run: make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless ARCHS="$ARCHS"

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: flexing-rootless-deb
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rootless-${{ github.run_number }}
          name: Rootless build #${{ github.run_number }}
          generate_release_notes: true
          files: packages/*.deb
