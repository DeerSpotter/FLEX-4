name: Build rootless DEB

on:
  push:
    branches:
      - rootless
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build FLEXing rootless package
    runs-on: ubuntu-latest
    env:
      CI: 1
      THEOS: ${{ github.workspace }}/.theos
      THEOS_PACKAGE_SCHEME: rootless

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Theos
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y bash curl sudo build-essential fakeroot rsync perl zip git libxml2 libtinfo6 xz-utils ca-certificates
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          test -d "$THEOS"
          test -x "$THEOS/toolchain/linux/iphone/bin/clang"
          ls -la "$THEOS/sdks"

      - name: Build package
        shell: bash
        run: |
          set -euxo pipefail
          sh tools/build-deb.sh
          ls -la packages
          dpkg-deb -I packages/*.deb

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: flexing-rootless-deb
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 30
